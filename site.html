<!DOCTYPE html>
<html>
<head>
  <title>Sala de Cinema - Dashboard de Filmes</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      font-family: 'Segoe UI', 'Arial', sans-serif;
    }
    
    .cinema-wall {
      background: linear-gradient(145deg, #1a1a1a 0%, #0d0d0d 100%);
      padding: 50px 60px 60px 60px;
      border-radius: 40px;
      box-shadow: 
        0 30px 50px rgba(0,0,0,0.6),
        inset 0 1px 2px rgba(255,255,255,0.08);
      position: relative;
    }
    

    .cinema-wall::before {
      content: "";
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 40px;
      background: radial-gradient(ellipse, rgba(255,215,0,0.3) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    
   
    .curtain-left {
      position: absolute;
      left: 0;
      top: 0;
      width: 80px;
      height: 100%;
      background: linear-gradient(90deg, #8B0000 0%, #b22222 30%, #8B0000 100%);
      border-radius: 20px 0 0 20px;
      opacity: 0.7;
      pointer-events: none;
    }
    
  
    .curtain-right {
      position: absolute;
      right: 0;
      top: 0;
      width: 80px;
      height: 100%;
      background: linear-gradient(-90deg, #8B0000 0%, #b22222 30%, #8B0000 100%);
      border-radius: 0 20px 20px 0;
      opacity: 0.7;
      pointer-events: none;
    }
    
  
    .curtain-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 30px;
      background: linear-gradient(180deg, #8B0000 0%, #b22222 50%, #6b0000 100%);
      border-radius: 20px 20px 0 0;
      opacity: 0.8;
      pointer-events: none;
    }
    

    .screen-frame {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 16px;
      box-shadow: 
        0 0 0 3px #d4af37,
        0 0 0 8px #1a1a1a,
        0 20px 40px rgba(0,0,0,0.5);
      position: relative;
    }
    
    
    .screen {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
    }
    
   
    .now-showing {
      text-align: center;
      margin-top: 25px;
      color: #d4af37;
      font-size: 18px;
      letter-spacing: 8px;
      text-transform: uppercase;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(212,175,55,0.5);
    }
    

    .wall-lights {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      gap: 20px;
    }
    
    .light {
      width: 30px;
      height: 8px;
      background: #d4af37;
      border-radius: 4px;
      box-shadow: 0 0 8px #d4af37;
      opacity: 0.6;
    }
    
    
    @media (max-width: 768px) {
      body {
        padding: 15px;
      }
      .cinema-wall {
        padding: 30px 20px 30px 20px;
      }
      .curtain-left, .curtain-right {
        width: 30px;
      }
      .now-showing {
        font-size: 12px;
        letter-spacing: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="cinema-wall">
    <!-- Cortinas decorativas -->
    <div class="curtain-top"></div>
    <div class="curtain-left"></div>
    <div class="curtain-right"></div>
    
    <!-- Moldura com a tela -->
    <div class="screen-frame">
      <div class="screen">
        <iframe 
          width="1200" 
          height="700" 
          src="https://datastudio.google.com/embed/reporting/c259ca58-1c22-422f-bdfb-5baeea6b945f/page/tnewF" 
          frameborder="0" 
          style="border:0; display: block;" 
          allowfullscreen 
          sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
        </iframe>
      </div>
    </div>
    
    <div class="now-showing">
      🎬 EM &nbsp;&nbsp; CARTAZ 🎬
    </div>
    

    <div class="wall-lights">
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
    </div>
  </div>
</body>
</html>
